
name: Bug Report
description: Report a bug found during testing
title: "[BUG] "
labels:
  - bug

body:
  - type: input
    id: bug_id
    attributes:
      label: Bug ID
      placeholder: BUG-001
    validations:
      required: true

  - type: input
    id: card_code
    attributes:
      label: Card Code
      placeholder: CARD-01
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: Enter steps to reproduce the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Windows 11 - Chrome
    validations:
      required: true

  - type: dropdown
    id: bug_level
    attributes:
      label: Bug Level
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Open
        - In Progress
        - Closed
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: Responsible person
    validations:
      required: true
